name: PHP version matrix

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  php-extension:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpize, php-config
          coverage: none

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf pkg-config libssl-dev

      - name: Build extension and run rung matrix
        run: php/tests/run-version-matrix.sh
        env:
          PHP_VERSIONS: ${{ matrix.php-version }}
